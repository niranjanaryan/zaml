[package]
name = "niranjanaryan/zaml"
version = "0.3.0"
description = "YAML to JSON and CBOR from the command line, powered by libyaml compiled to WebAssembly"
license = "MIT"
readme = "README.md"
categories = ["command-line", "parser", "yaml"]

# The module is the WebAssembly build of the command. The release workflow
# downloads it from the release of the tag before it publishes the package.
[[module]]
name = "zaml"
source = "zaml.wasi.wasm"
abi = "wasi"

[[command]]
name = "zaml"
module = "zaml"
runner = "wasi"
