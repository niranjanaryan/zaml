name: CI
on:
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install libyaml
        run: vcpkg install libyaml:x64-windows
      - name: Run simple module test
        env:
          YAML_INCLUDE_DIR: C:\vcpkg\installed\x64-windows\include
          YAML_LIB_DIR: C:\vcpkg\installed\x64-windows\lib
        run: python test.py
  test-mac-osx:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install libyaml
        run: brew install libyaml
      - name: Run simple module test
        run: python test.py
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install libyaml
        run: sudo apt-get update && sudo apt-get install -y libyaml-dev
      - name: Lint Python files # TODO: get Zig linting working
        uses: pre-commit/action@v3.0.1
      - name: Run simple module test
        run: python test.py
      - name: Generate benchmark fixture
        run: python benchmark/gen_big_yaml.py
      - name: Run benchmark
        working-directory: ./benchmark
        run: python benchmark.py
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # TODO: build wheels on other platforms
        # os: [ubuntu-22.04, windows-2019, macos-11]
        os: [ubuntu-22.04]
    env:
      # The glibc 2.17 (CentOS 7) headers cannot be parsed by zig's C
      # importer, so use the default manylinux_2_28 (AlmaLinux 8) image.
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheels
          path: ./wheelhouse/*.whl
          if-no-files-found: ignore
  build_sdist:
    needs: [test-mac-osx, test-windows]
    name: Make Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          password: ${{ secrets.pypi_password }}
